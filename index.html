<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Pintoo — 線上拼圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon" aria-hidden="true">🧩</span>
        <h1>Pintoo</h1>
        <span class="tagline">線上拼圖工具</span>
      </div>
      <div class="header-stats" id="headerStats" hidden>
        <span class="stat" id="timerStat">00:00</span>
        <span class="stat-divider">·</span>
        <span class="stat" id="progressStat">0 / 0</span>
      </div>
    </header>

    <main class="main">
      <!-- Upload screen -->
      <section class="upload-screen" id="uploadScreen">
        <div class="upload-card">
          <div class="upload-dropzone" id="dropzone" tabindex="0" role="button" aria-label="上傳圖片">
            <div class="upload-icon" aria-hidden="true">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
            </div>
            <h2>點擊上傳圖片</h2>
            <p class="desktop-only">或拖曳到這裡 · 支援 JPG、PNG、WebP、GIF</p>
            <p class="mobile-only">從相簿選擇 · 支援 JPG、PNG、WebP、GIF</p>
            <input type="file" id="fileInput" accept="image/*" hidden />
          </div>

          <div class="settings-panel">
            <label class="setting-label" for="difficulty">難易度</label>
            <div class="difficulty-row">
              <input type="range" id="difficulty" min="0" max="4" value="2" />
              <output id="difficultyLabel" for="difficulty">普通 · 6×6</output>
            </div>
            <ul class="difficulty-hints" id="difficultyHints">
              <li data-level="0">非常簡單 — 3×3（9 片）</li>
              <li data-level="1">簡單 — 4×4（16 片）</li>
              <li data-level="2" class="active">普通 — 6×6（36 片）</li>
              <li data-level="3">困難 — 8×8（64 片）</li>
              <li data-level="4">專家 — 12×12（144 片）</li>
            </ul>

            <p class="mobile-difficulty-tip mobile-only">手機建議選 4×4 或 3×3，操作較順手</p>

            <label class="setting-label checkbox-label">
              <input type="checkbox" id="showEdges" checked />
              <span>顯示拼圖邊框（較易辨識）</span>
            </label>
          </div>

          <button type="button" class="btn btn-primary btn-large" id="startFromSample">
            使用範例圖片試玩
          </button>
        </div>
      </section>

      <!-- Game screen -->
      <section class="game-screen" id="gameScreen" hidden>
        <nav class="toolbar" aria-label="遊戲選單">
          <div class="toolbar-group toolbar-actions">
            <button type="button" class="btn btn-ghost" id="btnNewImage" title="更換圖片">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
              <span>更換圖片</span>
            </button>
            <button type="button" class="btn btn-ghost" id="btnRestart" title="重新開始">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
              <span>重新開始</span>
            </button>
            <button type="button" class="btn btn-ghost" id="btnShuffle" title="打亂未放置的拼圖">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
              <span>打亂拼圖</span>
            </button>
            <button type="button" class="btn btn-ghost" id="btnHint" title="預覽原圖">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span>參考圖</span>
            </button>
            <button type="button" class="btn btn-ghost mobile-only" id="btnMobileSettings" title="設定" aria-expanded="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <span>設定</span>
            </button>
          </div>

          <div class="toolbar-divider desktop-only" aria-hidden="true"></div>

          <div class="toolbar-group toolbar-settings" id="toolbarSettings">
            <label class="toolbar-label" for="difficultyGame">難易度</label>
            <div class="difficulty-row compact">
              <input type="range" id="difficultyGame" min="0" max="4" value="2" />
              <output id="difficultyLabelGame" for="difficultyGame">6×6</output>
            </div>
            <button type="button" class="btn btn-secondary btn-small" id="btnApplyDifficulty">套用並重開</button>
          </div>
        </nav>

        <div class="game-area">
          <div class="game-workspace">
            <aside class="reference-panel" aria-label="參考圖">
              <h2 class="panel-title">參考圖</h2>
              <div class="reference-frame">
                <img id="referenceImage" alt="完整參考圖" />
              </div>
            </aside>
            <div class="play-panel">
              <div class="play-panel-header">
                <h2 class="panel-title">拼圖區</h2>
                <p class="pool-hint" id="trayHint" role="status"></p>
              </div>
              <div class="board-wrapper">
                <div class="board" id="board" aria-label="拼圖板">
                  <div class="board-grid" id="boardGrid"></div>
                </div>
              </div>
              <div class="piece-pool" aria-label="待拼拼圖片">
                <div class="piece-pool-inner" id="trayPieces"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Win modal -->
    <dialog class="modal" id="winModal">
      <div class="modal-content">
        <div class="modal-confetti" aria-hidden="true">🎉</div>
        <h2>恭喜完成！</h2>
        <p id="winMessage">你成功完成了拼圖</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" id="btnPlayAgain">再玩一次</button>
          <button type="button" class="btn btn-ghost" id="btnNewImageModal">更換圖片</button>
        </div>
      </div>
    </dialog>
  </div>

  <div class="reference-sheet" id="referenceSheet" hidden>
    <div class="reference-sheet-backdrop" id="referenceSheetBackdrop"></div>
    <div class="reference-sheet-panel">
      <div class="reference-sheet-header">
        <h2>參考圖</h2>
        <button type="button" class="btn btn-ghost reference-sheet-close" id="referenceSheetClose" aria-label="關閉">✕</button>
      </div>
      <div class="reference-sheet-body">
        <img id="referenceSheetImage" alt="完整參考圖" />
      </div>
    </div>
  </div>

  <canvas id="sourceCanvas" hidden></canvas>
  <div id="dragLayer" class="drag-layer" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
